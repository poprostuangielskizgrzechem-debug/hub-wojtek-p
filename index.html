<style>
  /* Paleta i font 1:1 z poprostuangielskizgrzechem.pl (globals.css). Uczniowie
     otwieraja to na telefonie, czesto z wlaczonym trybem ciemnym - bez jawnego
     tla i color-scheme Chrome na Androidzie potrafi sam przyciemnic strone. */
  :root {
    color-scheme: light;
    --primary: #1e5aae;
    --primary-dark: #164a8f;
    --primary-light: #e9f0fa;
    --accent: #ee4352;
    --background: #fbfaf8;
    --surface: #ffffff;
    --ink: #16181d;
    --muted: #67707e;
    --divider: #e8e6e1;
    --deep: #0e1524;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    max-width: 820px; margin: 0 auto; padding: 48px 20px 0;
    color: var(--ink); background: var(--background);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .brand span { font-weight: 800; font-size: 1rem; color: var(--primary); letter-spacing: .2px; }
  h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 28px; color: var(--ink); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  /* Na telefonie Unity ladauja pod miesiacami, nie obok - dwie kolumny po 200px
     robilyby z etykiet podrecznika slupek pojedynczych liter. */
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; gap: 8px; } }
  h2 { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 12px; }
  a { display: block; padding: 14px 18px; background: var(--primary-light); border-radius: 10px; text-decoration: none; color: var(--primary-dark); font-weight: 700; transition: background .15s; }
  a:hover { background: #dbe6ff; }
  .sub { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); margin-top: 3px; }
  .empty { padding: 14px 18px; border: 1px dashed var(--divider); border-radius: 10px; color: #9aa3b2; font-size: .9rem; }
  footer {
    margin: 56px -20px 0; padding: 32px 20px; background: var(--deep);
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px;
    border-radius: 999px; text-decoration: none; font-weight: 700; font-size: .9rem;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: #d63446; }
</style>
