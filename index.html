<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wojtek P. - Hub lekcyjny</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 60px 20px; color: #222; background: #fff; }
  h1 { font-size: 1.4rem; margin-bottom: 28px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; gap: 8px; } }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; margin: 0 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 12px; }
  a { display: block; padding: 14px 18px; background: #f0f4ff; border-radius: 10px; text-decoration: none; color: #1a4fd6; font-weight: 600; }
  a:hover { background: #dbe6ff; }
  .sub { display: block; font-weight: 400; font-size: .8rem; color: #6b7280; margin-top: 3px; }
  .empty { padding: 14px 18px; border: 1px dashed #d8dee9; border-radius: 10px; color: #9aa3b2; font-size: .9rem; }
</style>
</head>
<body>
<h1>Wojtek P. - materiały z lekcji</h1>
<div class="cols">
  <section>
    <h2>Notatki</h2>
    <ul>
      <li><a href="2026-09/">Wrzesień 2026</a></li>
      <li><a href="2026-08/">Sierpień 2026</a></li>
    </ul>
  </section>
  <section>
    <h2>Podręcznik</h2>
    <ul>
      <li class="empty">Jeszcze nic tu nie ma</li>
    </ul>
  </section>
</div>
</body>
</html>
